name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # intl is required: without it the ICU plural/select tests skip
          # silently, which is exactly the gap this workflow exists to close.
          extensions: curl, json, intl, redis
          coverage: none

      # A green suite means nothing if the ICU tests were skipped. Fail loudly
      # rather than let the job pass while the plural rules go unexercised.
      - name: Assert ext-intl is actually loaded
        run: |
          php -r 'if (!extension_loaded("intl")) { fwrite(STDERR, "ext-intl missing - ICU tests would skip\n"); exit(1); }'
          php -r 'printf("intl %s / ICU %s\n", phpversion("intl"), INTL_ICU_VERSION);'

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # LANGSYS_REQUIRE_INTL turns the ICU tests' markTestSkipped into a hard
      # failure, so they cannot pass by quietly not running. Some skips here are
      # still expected and correct - the missing-intl degradation tests skip
      # precisely BECAUSE intl is present - so a blanket "no skips" check would
      # be wrong in the other direction.
      - name: Run test suite
        env:
          LANGSYS_REQUIRE_INTL: '1'
        run: vendor/bin/phpunit

  # The graceful-degradation path (missing ext-intl warns once, falls back to
  # simple substitution, and NEVER throws) is skipped on every matrix leg above,
  # because those all have intl. Without this job it is only ever exercised on a
  # developer laptop that happens to lack the extension.
  no-intl:
    name: Degradation without ext-intl
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP without intl
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # The ':' prefix REMOVES an extension. Listing only curl and json is
          # not enough - the extensions input adds to the base image, and Ubuntu
          # PHP builds already ship intl, so this job would run with intl loaded
          # and report the degradation path as verified when it never ran.
          extensions: curl, json, :intl
          coverage: none

      - name: Assert ext-intl is absent
        run: |
          php -r 'if (extension_loaded("intl")) { fwrite(STDERR, "intl present - this job must run WITHOUT it\n"); exit(1); }'

      # ext-intl is a hard composer requirement, so the platform check has to be
      # bypassed to simulate a host that lost intl after install.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-intl

      # LANGSYS_REQUIRE_INTL is deliberately NOT set here: the ICU tests should
      # skip, and the degradation tests should run.
      - name: Run test suite
        run: vendor/bin/phpunit

  lint:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl, json, intl
          coverage: none

      # Guards the documented 7.4 floor: catches any 8.x-only syntax that would
      # parse fine on a modern dev box but break the minimum supported runtime.
      - name: Lint all source files against the 7.4 floor
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || status=1
          done < <(find src tests -name '*.php')
          exit $status
